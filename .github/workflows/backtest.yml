name: VRF backtest

on:
  workflow_dispatch:
    inputs:
      market:
        description: "GPW, USA albo ALL"
        default: "GPW"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python backtest.py ${{ inputs.market }}
      - name: Wyslij podsumowanie na Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for f in results/summary_*.txt; do
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(printf '<pre>%s</pre>' "$(cat "$f")")" \
              --data-urlencode "parse_mode=HTML" > /dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vrf-backtest
          path: results/
